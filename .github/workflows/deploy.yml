name: Deploy To Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy on self-hosted runner
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          BRANCH: main
        run: |
          if [ -z "$APP_DIR" ]; then
            APP_DIR="/opt/project-issue-analytics"
          fi

          CANDIDATE_A="$APP_DIR"
          CANDIDATE_B="$APP_DIR/project-issue-analytics"

          if [ -f "$CANDIDATE_A/scripts/deploy.sh" ]; then
            APP_DIR="$CANDIDATE_A"
          elif [ -f "$CANDIDATE_B/scripts/deploy.sh" ]; then
            APP_DIR="$CANDIDATE_B"
          else
            echo "[deploy] Could not find scripts/deploy.sh in:"
            echo "  - $CANDIDATE_A"
            echo "  - $CANDIDATE_B"
            exit 1
          fi

          export APP_DIR
          cd "$APP_DIR"

          # Clear broken proxy placeholders that can break git fetch on self-hosted runners.
          if [ "${HTTP_PROXY:-}" = "YOUR_PROXY_HOST:PORT" ] || [ "${HTTPS_PROXY:-}" = "YOUR_PROXY_HOST:PORT" ] || [ "${http_proxy:-}" = "YOUR_PROXY_HOST:PORT" ] || [ "${https_proxy:-}" = "YOUR_PROXY_HOST:PORT" ]; then
            echo "[deploy] Clearing invalid proxy placeholder values"
            unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy NO_PROXY no_proxy
          fi

          echo "[deploy] Validating git write permissions"
          if [ ! -w "$APP_DIR/.git" ]; then
            echo "[deploy] .git is not writable by runner user $(id -un)"
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              echo "[deploy] Attempting automatic ownership fix with sudo"
              sudo chown -R "$(id -un):$(id -gn)" "$APP_DIR/.git"
            fi
          fi

          if [ ! -w "$APP_DIR/.git" ]; then
            echo "[deploy] ERROR: Runner user $(id -un) cannot write to $APP_DIR/.git"
            echo "[deploy] Run on server: sudo chown -R $(id -un):$(id -gn) $APP_DIR"
            exit 1
          fi

          echo "[deploy] Ensuring scripts/deploy.sh matches repository"
          git config --global --add safe.directory "$APP_DIR"
          git config --global --unset-all http.proxy || true
          git config --global --unset-all https.proxy || true
          git fetch origin "$BRANCH"
          git checkout "origin/$BRANCH" -- scripts/deploy.sh

          bash "$APP_DIR/scripts/deploy.sh"
