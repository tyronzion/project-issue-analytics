name: Deploy To Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Deploy on self-hosted runner
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          BRANCH: main
          PM2_APP_NAME: project-analytics
        run: |
          if [ -z "$APP_DIR" ]; then
            export APP_DIR=/opt/project-issue-analytics
          fi
          cd "$APP_DIR"
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh
