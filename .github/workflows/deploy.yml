name: Deploy To Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Deploy on self-hosted runner
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          BRANCH: main
          PM2_APP_NAME: project-analytics
        run: |
          if [ -z "$APP_DIR" ]; then
            APP_DIR="/opt/project-issue-analytics"
          fi

          CANDIDATE_A="$APP_DIR"
          CANDIDATE_B="$APP_DIR/project-issue-analytics"

          if [ -f "$CANDIDATE_A/scripts/deploy.sh" ]; then
            APP_DIR="$CANDIDATE_A"
          elif [ -f "$CANDIDATE_B/scripts/deploy.sh" ]; then
            APP_DIR="$CANDIDATE_B"
          else
            echo "[deploy] Could not find scripts/deploy.sh in:"
            echo "  - $CANDIDATE_A"
            echo "  - $CANDIDATE_B"
            exit 1
          fi

          export APP_DIR
          cd "$APP_DIR"
          chmod +x "$APP_DIR/scripts/deploy.sh"
          "$APP_DIR/scripts/deploy.sh"
