<!-- @dsCard group="Components" viewport="700x320" name="Badges, avatars & stats" subtitle="Status pills, identity, dashboard metrics" -->
<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--color-background-page)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { Badge, Avatar, AvatarStack, StatTile } = window.CloudstaffDesignSystem_e09b25;
ReactDOM.createRoot(document.getElementById("root")).render(
  <div className="stack-lg">
    <div className="cluster" style={{ gap: "var(--space-sm)" }}>
      <Badge variant="neutral">Draft</Badge>
      <Badge variant="brand">Featured</Badge>
      <Badge variant="success">Approved</Badge>
      <Badge variant="warning">Pending</Badge>
      <Badge variant="danger">Returned</Badge>
      <Badge variant="info">New</Badge>
    </div>
    <div className="cluster" style={{ gap: "var(--space-md)" }}>
      <Avatar initials="JC" status="online" />
      <Avatar size="lg" initials="MR" status="busy" />
      <Avatar size="lg" initials="DM" status="away" />
      <AvatarStack>
        <Avatar size="sm" initials="A" />
        <Avatar size="sm" initials="B" />
        <Avatar size="sm" initials="C" />
        <Avatar size="sm" className="avatar-overflow" initials="+3" />
      </AvatarStack>
    </div>
    <div className="grid-4">
      <StatTile label="Pending review" value="7" delta="Steady" deltaVariant="info" />
      <StatTile label="Approved this week" value="42" delta="+12%" deltaVariant="success" />
      <StatTile label="Returned to staff" value="3" />
      <StatTile label="Avg approval time" value="4.2" unit="hrs" delta="−18%" deltaVariant="success" />
    </div>
  </div>
);
</script>
</body>
</html>
