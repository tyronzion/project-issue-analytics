<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { Field, Input, Select, Switch, Checkbox, SearchInput } = window.CloudstaffDesignSystem_e09b25;
ReactDOM.createRoot(document.getElementById("root")).render(
  <div className="grid-2" style={{ gap: "var(--space-xl)", maxWidth: "640px" }}>
    <Field label="Full name" hint="As it appears on your contract." htmlFor="n" required>
      <Input id="n" type="text" defaultValue="Janet Cruz" />
    </Field>
    <Field label="Work email" htmlFor="e" error="Enter a valid email address.">
      <Input id="e" type="email" defaultValue="janet@" invalid />
    </Field>
    <Field label="Team" htmlFor="t">
      <Select id="t"><option>Operations</option><option>Engineering</option><option>Finance</option></Select>
    </Field>
    <Field label="Search" htmlFor="s">
      <SearchInput placeholder="Search timesheets…" />
    </Field>
    <div className="stack-sm">
      <Switch label="Email notifications" defaultChecked />
      <Switch label="SMS reminders" />
      <Checkbox label="I accept the staff handbook" defaultChecked />
    </div>
  </div>
);
</script>
</body>
