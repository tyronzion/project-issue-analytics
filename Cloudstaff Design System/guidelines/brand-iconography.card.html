<!-- @dsCard group="Brand" viewport="700x170" name="Iconography — Font Awesome 6 Free" subtitle="Solid style, ~1rem, currentColor" -->
<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--color-background-primary)}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:16px}
  .i{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--color-foreground-secondary)}
  .i i{font-size:22px;color:var(--color-brand-primary)}
  .i small{font-family:var(--font-family-mono);font-size:9px;color:var(--color-foreground-muted)}
</style></head>
<body>
  <div class="grid">
    <div class="i"><i class="fa-solid fa-house"></i><small>house</small></div>
    <div class="i"><i class="fa-solid fa-clock"></i><small>clock</small></div>
    <div class="i"><i class="fa-solid fa-calendar"></i><small>calendar</small></div>
    <div class="i"><i class="fa-solid fa-users"></i><small>users</small></div>
    <div class="i"><i class="fa-regular fa-file-lines"></i><small>file-lines</small></div>
    <div class="i"><i class="fa-solid fa-gear"></i><small>gear</small></div>
    <div class="i"><i class="fa-solid fa-bell"></i><small>bell</small></div>
    <div class="i"><i class="fa-solid fa-magnifying-glass"></i><small>search</small></div>
    <div class="i"><i class="fa-solid fa-plus"></i><small>plus</small></div>
    <div class="i"><i class="fa-solid fa-filter"></i><small>filter</small></div>
    <div class="i"><i class="fa-solid fa-location-dot"></i><small>location</small></div>
    <div class="i"><i class="fa-solid fa-star"></i><small>star</small></div>
    <div class="i"><i class="fa-solid fa-robot"></i><small>robot</small></div>
    <div class="i"><i class="fa-solid fa-circle-check"></i><small>check</small></div>
    <div class="i"><i class="fa-solid fa-triangle-exclamation"></i><small>warn</small></div>
    <div class="i"><i class="fa-solid fa-arrow-right-from-bracket"></i><small>sign-out</small></div>
    <div class="i"><i class="fa-solid fa-paper-plane"></i><small>send</small></div>
    <div class="i"><i class="fa-solid fa-ellipsis"></i><small>more</small></div>
    <div class="i"><i class="fa-solid fa-cloud-arrow-up"></i><small>upload</small></div>
    <div class="i"><i class="fa-solid fa-chevron-right"></i><small>chevron</small></div>
  </div>
</body></html>
