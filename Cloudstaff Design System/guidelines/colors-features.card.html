<!-- @dsCard group="Colors" viewport="700x150" name="Feature palette" subtitle="10 accent colours for charts, tags & illustration" -->
<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--color-background-page);font-family:var(--font-family-body)}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--color-border-subtle)}
  .sw span{font-family:var(--font-family-mono);font-size:10px;color:var(--color-foreground-muted);text-align:center}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--color-feature-01)"></div><span>01</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-feature-02)"></div><span>02</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-feature-03)"></div><span>03</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-feature-04)"></div><span>04</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-feature-05)"></div><span>05</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-feature-06)"></div><span>06</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-feature-07)"></div><span>07</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-feature-08)"></div><span>08</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-feature-09)"></div><span>09</span></div>
    <div class="sw"><div class="chip" style="background:var(--color-feature-10)"></div><span>10</span></div>
  </div>
</body></html>
