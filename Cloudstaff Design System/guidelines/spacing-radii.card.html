<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="--radius-xs → 3xl, pill & round" -->
<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--color-background-primary)}
  .row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
  .b{display:flex;flex-direction:column;gap:6px;align-items:center}
  .sq{width:62px;height:62px;background:var(--color-brand-primary-soft);border:1.5px solid var(--color-brand-primary)}
  .b small{font-family:var(--font-family-mono);font-size:10px;color:var(--color-foreground-muted)}
</style></head>
<body>
  <div class="row">
    <div class="b"><div class="sq" style="border-radius:var(--radius-xs)"></div><small>xs</small></div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-sm)"></div><small>sm</small></div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-md)"></div><small>md</small></div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-lg)"></div><small>lg</small></div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-xl)"></div><small>xl</small></div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-2xl)"></div><small>2xl</small></div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-3xl)"></div><small>3xl</small></div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-pill)"></div><small>pill</small></div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-round)"></div><small>round</small></div>
  </div>
</body></html>
