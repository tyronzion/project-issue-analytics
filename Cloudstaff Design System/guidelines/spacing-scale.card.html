<!-- @dsCard group="Spacing" viewport="700x190" name="Spacing scale" subtitle="--space-2xs → 6xl, 0.125rem base step" -->
<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--color-background-primary)}
  .r{display:flex;align-items:center;gap:12px;margin-bottom:7px}
  .r .t{font-family:var(--font-family-mono);font-size:10px;color:var(--color-foreground-muted);width:42px;flex:none}
  .bar{height:14px;background:var(--color-brand-primary);border-radius:3px}
</style></head>
<body>
  <div class="r"><span class="t">xs</span><div class="bar" style="width:var(--space-xs)"></div></div>
  <div class="r"><span class="t">sm</span><div class="bar" style="width:var(--space-sm)"></div></div>
  <div class="r"><span class="t">md</span><div class="bar" style="width:var(--space-md)"></div></div>
  <div class="r"><span class="t">lg</span><div class="bar" style="width:var(--space-lg)"></div></div>
  <div class="r"><span class="t">xl</span><div class="bar" style="width:var(--space-xl)"></div></div>
  <div class="r"><span class="t">2xl</span><div class="bar" style="width:var(--space-2xl)"></div></div>
  <div class="r"><span class="t">3xl</span><div class="bar" style="width:var(--space-3xl)"></div></div>
  <div class="r"><span class="t">4xl</span><div class="bar" style="width:var(--space-4xl)"></div></div>
  <div class="r"><span class="t">5xl</span><div class="bar" style="width:var(--space-5xl)"></div></div>
  <div class="r"><span class="t">6xl</span><div class="bar" style="width:var(--space-6xl)"></div></div>
</body></html>
