<!-- @dsCard group="Type" viewport="700x230" name="Heading scale — Poppins" subtitle="h1–h6, tight tracking, bold display weights" -->
<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--color-background-primary)}
  .r{display:flex;align-items:baseline;gap:14px;padding:4px 0;border-bottom:1px solid var(--color-border-subtle)}
  .r:last-child{border:0}
  .t{font-family:var(--font-family-mono);font-size:10px;color:var(--color-foreground-muted);width:48px;flex:none}
  h1,h2,h3,h4,h5,h6{margin:0}
  h1{font-size:2.5rem}h2{font-size:2rem}
</style></head>
<body>
  <div class="r"><span class="t">h1</span><h1>Cloudstaff</h1></div>
  <div class="r"><span class="t">h2</span><h2>Your global team</h2></div>
  <div class="r"><span class="t">h3</span><h3>Timesheet approvals</h3></div>
  <div class="r"><span class="t">h4</span><h4>This week's submissions</h4></div>
  <div class="r"><span class="t">h5</span><h5>Pending review</h5></div>
  <div class="r"><span class="t">h6</span><h6>Updated 2 hours ago</h6></div>
</body></html>
