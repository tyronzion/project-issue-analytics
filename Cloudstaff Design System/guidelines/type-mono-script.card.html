<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--color-background-primary)}
  .mono{font-family:var(--font-family-mono);font-size:15px;color:var(--color-foreground-primary);line-height:2}

  .cap{font-family:var(--font-family-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--color-foreground-muted);margin-bottom:6px}
</style></head>
<body>
  <div class="cap">Chivo Mono — data, timestamps, code</div>
  <div class="mono">38.5 hrs &nbsp; <span class="m">·</span> &nbsp; Wk 17 · Apr 21–27 &nbsp; <span class="m">·</span> &nbsp; ₱ 1,240.00 &nbsp; <span class="m">·</span> &nbsp; 09:30 AM</div>
  <div class="cap" style="margin-top:14px">Pacifico — decorative accent only</div>
  <div class="script">Welcome back, Janet!</div>
</body></html>
