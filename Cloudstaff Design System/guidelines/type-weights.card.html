<!-- @dsCard group="Type" viewport="700x150" name="Font weights" subtitle="Manrope 300–800 weight axis" -->
<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--color-background-primary)}
  .row{display:flex;gap:26px;flex-wrap:wrap}
  .w{display:flex;flex-direction:column;gap:2px}
  .w span{font-size:30px;line-height:1.1;font-family:var(--font-family-body)}
  .w small{font-family:var(--font-family-mono);font-size:10px;color:var(--color-foreground-muted)}
</style></head>
<body>
  <div class="row">
    <div class="w"><span style="font-weight:300">Aa</span><small>300 light</small></div>
    <div class="w"><span style="font-weight:400">Aa</span><small>400 regular</small></div>
    <div class="w"><span style="font-weight:500">Aa</span><small>500 medium</small></div>
    <div class="w"><span style="font-weight:600">Aa</span><small>600 semibold</small></div>
    <div class="w"><span style="font-weight:700">Aa</span><small>700 bold</small></div>
    <div class="w"><span style="font-weight:800">Aa</span><small>800 extrabold</small></div>
  </div>
</body></html>
