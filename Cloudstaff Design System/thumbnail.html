<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%}
  .tile{display:flex;height:100vh;width:100vw}
  .main{flex:1;background:var(--color-brand-primary);display:grid;place-items:center;padding:6% 5%}
  .main img{width:78%;max-width:820px;height:auto}
  .strip{display:flex;flex-direction:column;width:180px;flex:none}
  .strip>div{flex:1}
</style></head>
<body>
  <div class="tile">
    <div class="main">
      <img src="assets/logos/cloudstaff-logo-landscape-mono-reversed.svg" alt="Cloudstaff">
    </div>
    <div class="strip">
      <div style="background:var(--color-utility-warning)"></div>
      <div style="background:var(--color-brand-secondary)"></div>
      <div style="background:var(--color-feature-03)"></div>
      <div style="background:var(--color-feature-04)"></div>
    </div>
  </div>
</body></html>
