version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: project-analytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-project_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - project_analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-project_user} -d ${POSTGRES_DB:-project_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  project_analytics_postgres_data:
